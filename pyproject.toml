[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosteering-workbench"
version = "0.1.0"
description = "Local Streamlit application for geosteering practice with synthetic wells."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  # Keep major versions bounded to reduce resolver conflicts.
  "streamlit>=1.40,<2",
  "plotly>=5.24,<7",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
  "pyarrow>=17.0,<24",
  "lasio>=0.31,<1",
  "reportlab>=4.2,<5",
  "matplotlib>=3.8,<4",
  # Streamlit pulls protobuf constraints transitively, but pinning here avoids
  # resolver conflicts in mixed environments.
  "protobuf>=3.20,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pypdf>=5.0",
]
dev = [
  "ruff>=0.6.9",
  "build>=1.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
