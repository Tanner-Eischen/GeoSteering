[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosteering-workbench"
version = "0.1.0"
description = "Offline-first geosteering MVP workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40",
  "plotly>=5.24",
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.9",
  "pyarrow>=17.0",
  "lasio>=0.31",
  "reportlab>=4.2",
  "kaleido==0.2.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pypdf>=5.0",
]
dev = [
  "ruff>=0.6.9",
  "mypy>=1.11",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
