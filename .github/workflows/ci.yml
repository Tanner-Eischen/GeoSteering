name: Scientific validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[test,dev]' build
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m build
      - run: python -m tools.run_case_study --out /tmp/geosteering-case-study --seed 123
      - uses: actions/upload-artifact@v4
        with:
          name: structural-uncertainty-case-study
          path: |
            /tmp/geosteering-case-study/project/exports
            /tmp/geosteering-case-study/project/runs/*/cache/report_snapshots
